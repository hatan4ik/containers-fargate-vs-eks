name: Terraform Plan (manual)

on:
  workflow_dispatch:
    # checkov:skip=CKV_GHA_7: expires 2027-09-18; input is allowlisted below and selects a protected environment only.
    inputs:
      environment:
        description: "Target environment with a configured GitHub Environment and S3 state"
        required: true
        type: choice
        options: [fargate-dev, fargate-prod, eks-dev, eks-prod]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}-plan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authorize tagged Git module retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Produce a locked, no-apply plan
        env:
          TARGET: ${{ inputs.environment }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          TERRAFORM_TFVARS_B64: ${{ secrets.TERRAFORM_TFVARS_B64 }}
        run: scripts/ci/terraform-plan.sh "$TARGET"
