name: Terraform Apply (manual)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "ecs or eks"
        required: true
        default: "ecs"
        type: choice
        options: [ecs, eks]
      image_tag:
        description: "Required for ECS: immutable sha-<40 hex> tag built by the image workflow"
        required: false
        type: string
      confirm_apply:
        description: "Set to true after reviewing the intended environment and image tag"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  apply:
    if: ${{ inputs.confirm_apply == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-${{ inputs.track }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply (ECS)
        if: ${{ inputs.track == 'ecs' }}
        working-directory: labs/10-ecs-fargate-track/terraform
        run: |
          printf '%s\n' "$IMAGE_TAG" | grep -Eq '^sha-[0-9a-f]{40}$'
          terraform init -lockfile=readonly
          terraform plan -out=tfplan \
            -var "image_gateway=${ECR_REGISTRY}/gateway:${IMAGE_TAG}" \
            -var "image_users=${ECR_REGISTRY}/users:${IMAGE_TAG}" \
            -var "image_orders=${ECR_REGISTRY}/orders:${IMAGE_TAG}"
          terraform apply -auto-approve tfplan

      - name: Terraform apply (EKS)
        if: ${{ inputs.track == 'eks' }}
        working-directory: labs/20-eks-track/terraform
        run: |
          terraform init -lockfile=readonly
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
