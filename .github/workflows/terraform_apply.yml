name: Terraform Plan (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment with a configured GitHub Environment and S3 state"
        required: true
        type: choice
        options: [fargate-dev, fargate-prod, eks-dev, eks-prod]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}-plan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Authorize tagged Git module retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Select immutable environment root
        id: root
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          case "$TARGET" in
            fargate-dev) echo "path=environments/fargate/dev" >> "$GITHUB_OUTPUT" ;;
            fargate-prod) echo "path=environments/fargate/prod" >> "$GITHUB_OUTPUT" ;;
            eks-dev) echo "path=environments/eks/dev" >> "$GITHUB_OUTPUT" ;;
            eks-prod) echo "path=environments/eks/prod" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Initialize encrypted remote state
        working-directory: ${{ steps.root.outputs.path }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
        run: |
          : "${TF_STATE_BUCKET:?Configure TF_STATE_BUCKET in this GitHub Environment}"
          : "${TF_STATE_KMS_KEY_ID:?Configure TF_STATE_KMS_KEY_ID in this GitHub Environment}"
          : "${TF_STATE_REGION:?Configure TF_STATE_REGION in this GitHub Environment}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="kms_key_id=${TF_STATE_KMS_KEY_ID}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform validate

      - name: Produce a locked, no-apply plan
        id: plan
        working-directory: ${{ steps.root.outputs.path }}
        run: |
          test -f terraform.tfvars
          set +e
          terraform plan -input=false -lock-timeout=5m -detailed-exitcode -out=tfplan -var-file=terraform.tfvars
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then exit 1; fi
          terraform show -json tfplan > tfplan.json
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Publish non-sensitive plan summary
        working-directory: ${{ steps.root.outputs.path }}
        env:
          TARGET: ${{ inputs.environment }}
        run: |
          jq -r '
            [ .resource_changes[]?.change.actions[] ]
            | group_by(.)
            | map({action: .[0], count: length})
            | .[]
            | "| \(.action) | \(.count) |"
          ' tfplan.json > plan-counts.md
          {
            echo "## Terraform plan: ${TARGET}"
            echo
            echo "| Action | Count |"
            echo "| --- | ---: |"
            cat plan-counts.md
          } >> "$GITHUB_STEP_SUMMARY"
