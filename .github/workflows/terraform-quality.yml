name: Terraform Quality

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "modules/**"
      - "environments/**"
      - ".github/workflows/terraform-quality.yml"
      - ".pre-commit-config.yaml"
      - ".terraform-docs.yml"
      - ".tflint.hcl"
      - "Makefile"
  push:
    branches: ["main"]
    paths:
      - "bootstrap/**"
      - "modules/**"
      - "environments/**"
      - ".github/workflows/terraform-quality.yml"
      - ".pre-commit-config.yaml"
      - ".terraform-docs.yml"
      - ".tflint.hcl"
      - "Makefile"

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, validate, test, and document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
      - uses: terraform-linters/setup-tflint@v5
      - name: Terraform quality gates
        env:
          TERRAFORM_DOCS: docker run --rm -v ${{ github.workspace }}:/work -w /work quay.io/terraform-docs/terraform-docs:0.20.0
        run: make terraform-ci

  security:
    name: Checkov IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: false
